name: Weekly FEC Update

on:
  schedule:
    - cron: '0 12 * * 1'  # Every Monday at 8am ET (12pm UTC)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  fec-update:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── FEC INCREMENTAL SCAN ──
      # Pulls newest records first, stops when it hits data we already have.
      # No date filter needed — early bail handles efficiency.
      - name: Pull FEC receipts
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scrapers/fec_scraper.py 2026 a

      - name: Pull FEC expenditures
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scrapers/fec_scraper.py 2026 b

      # ── VERIFY ──
      - name: Verify no data loss
        run: |
          python3 -c "
          import csv
          for fname, id_field, min_expected in [
              ('data/federal_2026/receipts.csv', 'transaction_id', 147000),
              ('data/federal_2026/expenditures.csv', 'transaction_id', 5000)
          ]:
              with open(fname) as f:
                  ids = [r[id_field] for r in csv.DictReader(f) if r.get(id_field)]
              dupes = len(ids) - len(set(ids))
              print(f'{fname}: {len(ids):,} records, {dupes} duplicates')
              assert dupes == 0, f'{fname} has duplicates!'
              assert len(ids) >= min_expected, f'Only {len(ids):,} records — expected at least {min_expected:,}. Aborting.'
          print('All clean')
          "

      # ── PUSH RAW DATA ONLY ──
      - name: Push raw FEC data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/federal_2026/
          if git diff --staged --quiet; then
            echo "No new FEC records"
          else
            git commit -m "Weekly FEC update: $(date +%Y-%m-%d)"
            git push
          fi
